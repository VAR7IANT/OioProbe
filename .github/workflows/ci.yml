name: Phase baseline verification
on: [push, pull_request]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npx playwright install --with-deps chromium firefox webkit
      - run: npm run test:browser
      - run: python3 scripts/fetch-komari.py
      - run: npm run test:compat
      - run: npm run theme:pack
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: phase-baseline-evidence
          path: |
            evidence/
            artifacts/
            playwright-report/
  grok-ui:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build -w @oioprobe/grok-ui
      - run: npx playwright install --with-deps chromium
      - run: npm run test:grok-ui
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: grok-ui-evidence
          path: evidence/grok-ui/
